# CI: validate the Jekyll build, audit links, smoke-test performance.
# Runs on pushes to master and on all pull requests.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: jekyll build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build with strict front matter
        run: bundle exec jekyll build --strict-front-matter --trace
      - name: Upload built site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: _site
          retention-days: 7

  links:
    name: link check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml ./_site/**/*.html ./_site/sitemap.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: lighthouse (informational)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      # Lighthouse needs the git context for its upload step.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site
      - name: Serve built site
        run: npx --yes serve@latest _site -l 8080 & npx --yes wait-on@latest http://localhost:8080/
      - name: Serve and audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/games/lightsout/lightsout.html
          uploadArtifacts: true
          temporaryPublicStorage: true
